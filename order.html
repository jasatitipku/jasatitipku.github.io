<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0F172A" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Ambil Orderan — JasaTitipku</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0F172A;
      color: #FFFFFF;
      overflow: hidden;
    }
    .container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at 20% 20%, rgba(96, 165, 250, 0.08), transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(74, 222, 128, 0.06), transparent 40%),
        #0F172A;
    }
    .card {
      background: #1E293B;
      border: 1px solid #334155;
      border-radius: 24px;
      padding: 32px 24px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }
    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      border-radius: 20px;
      background: linear-gradient(135deg, #2563EB, #1D4ED8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.4);
    }
    .title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .subtitle { font-size: 14px; color: #94A3B8; margin-bottom: 20px; line-height: 1.5; }
    .order-badge {
      background: #0F172A;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 20px;
      font-family: "SF Mono", "Monaco", monospace;
      font-size: 13px;
      color: #60A5FA;
      word-break: break-all;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .order-badge span { flex: 1; text-align: left; }
    .copy-btn {
      background: #1E293B;
      border: 1px solid #334155;
      color: #94A3B8;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
    }
    .spinner {
      width: 44px;
      height: 44px;
      margin: 0 auto 16px;
      border: 3px solid #334155;
      border-top-color: #60A5FA;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status-text { font-size: 14px; color: #94A3B8; margin-bottom: 8px; }
    .btn {
      display: block;
      width: 100%;
      padding: 14px 20px;
      border-radius: 14px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 12px;
      text-decoration: none;
    }
    .btn-primary { background: #2563EB; color: #FFFFFF; }
    .btn-secondary {
      background: transparent;
      border: 1px solid #334155;
      color: #94A3B8;
    }
    .footer { margin-top: 20px; font-size: 11px; color: #475569; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <div id="cardLoading" class="card">
      <div class="logo">📦</div>
      <h1 class="title">Membuka Aplikasi</h1>
      <p class="subtitle">Menghubungkan ke JasaTitipku...</p>
      <div class="order-badge">
        <span id="orderIdLoading">-</span>
        <button class="copy-btn" onclick="copyOrderId()">Salin</button>
      </div>
      <div class="spinner"></div>
      <p class="status-text">Mengalihkan ke aplikasi...</p>
      <button class="btn btn-secondary hidden" id="btnOpenManual" onclick="openApp(true)">
        Buka Aplikasi Manual
      </button>
    </div>

    <div id="cardError" class="card hidden">
      <div class="logo">⚠️</div>
      <h1 class="title">Order ID Tidak Ditemukan</h1>
      <p class="subtitle">Link tidak valid. Buka ulang dari grup Telegram.</p>
    </div>

    <p class="footer">JasaTitipku © 2026</p>
  </div>

  <script>
    const CONFIG = {
      scheme: "myapp",
      host: "driver",
      pathPrefix: "/order/",
      packageName: "com.jasatitipku.app",
      playStoreUrl: "https://play.google.com/store/apps/details?id=com.jasatitipku.app"
    };

    let orderId = null;
    let appOpened = false;

    window.addEventListener("load", function () {
      orderId = getQueryParam("id");

      if (!orderId || !/^ORD-\d+-[A-Z0-9]+$/.test(orderId)) {
        document.getElementById("cardLoading").classList.add("hidden");
        document.getElementById("cardError").classList.remove("hidden");
        return;
      }

      document.getElementById("orderIdLoading").textContent = orderId;
      startRedirect();
    });

    function startRedirect() {
      // Deteksi visibility
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") {
          appOpened = true;
        }
      });
      window.addEventListener("pagehide", () => { appOpened = true; });
      window.addEventListener("blur", () => {
        setTimeout(() => {
          if (document.visibilityState === "hidden") appOpened = true;
        }, 100);
      });

      // 1. Try intent:// (Android — tidak butuh gesture, punya fallback ke Play Store)
      const isAndroid = /android/i.test(navigator.userAgent);

      if (isAndroid) {
        const intentUrl =
          "intent://" + CONFIG.host + CONFIG.pathPrefix + encodeURIComponent(orderId) +
          "#Intent;scheme=" + CONFIG.scheme +
          ";package=" + CONFIG.packageName +
          ";S.browser_fallback_url=" + encodeURIComponent(CONFIG.playStoreUrl) +
          ";end";

        // 1a. Langsung trigger intent://
        try {
          window.location.replace(intentUrl);
        } catch (e) {
          console.warn("intent failed:", e);
        }

        // 1b. Tampilkan tombol manual sebagai fallback kalau 1.5s masih di sini
        setTimeout(() => {
          if (!appOpened && document.visibilityState === "visible") {
            document.getElementById("btnOpenManual").classList.remove("hidden");
            document.querySelector(".status-text").textContent =
              "Jika app tidak terbuka, ketuk tombol di bawah:";
          }
        }, 1500);

      } else {
        // Bukan Android → langsung ke Play Store
        window.location.replace(CONFIG.playStoreUrl);
      }
    }

    function openApp(isManual) {
      if (!orderId) return;
      const isAndroid = /android/i.test(navigator.userAgent);
      if (isAndroid) {
        const intentUrl =
          "intent://" + CONFIG.host + CONFIG.pathPrefix + encodeURIComponent(orderId) +
          "#Intent;scheme=" + CONFIG.scheme +
          ";package=" + CONFIG.packageName +
          ";S.browser_fallback_url=" + encodeURIComponent(CONFIG.playStoreUrl) +
          ";end";
        window.location.href = intentUrl;
      } else {
        window.location.href = CONFIG.playStoreUrl;
      }
    }

    function getQueryParam(name) {
      try {
        return new URLSearchParams(window.location.search).get(name);
      } catch (e) {
        const m = window.location.search.match(new RegExp("[?&]" + name + "=([^&]*)"));
        return m ? decodeURIComponent(m[1]) : null;
      }
    }

    function copyOrderId() {
      if (!orderId) return;
      const t = document.createElement("textarea");
      t.value = orderId;
      t.style.position = "fixed";
      t.style.opacity = "0";
      document.body.appendChild(t);
      t.select();
      try {
        document.execCommand("copy");
        document.querySelectorAll(".copy-btn").forEach(btn => {
          const o = btn.textContent;
          btn.textContent = "✓";
          setTimeout(() => btn.textContent = o, 1500);
        });
      } catch (e) {}
      document.body.removeChild(t);
    }
  </script>
</body>
</html>
